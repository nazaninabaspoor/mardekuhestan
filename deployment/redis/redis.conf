# ==============================================================================
# تنظیمات پیشنهادی Redis برای محیط Production مرد کوهستان
# اهداف: مدیریت بهینه رم (Anti-OOM)، پاکسازی خودکار کلیدهای قدیمی و پایداری بالا
# ==============================================================================

# اتصال و پورت
bind 127.0.0.1
port 6379
protected-mode yes
tcp-backlog 2048
timeout 300
tcp-keepalive 60

# سقف حافظه مجاز (Memory Capping برای مهار کامل مصرف رم سرور)
maxmemory 512mb

# سیاست پاکسازی داده‌ها در زمان پر شدن حافظه:
# کلیدهای دارای TTL (مثل سشن‌ها، کش‌ها و کلیدهای Rate Limit) به روش LRU پاک شوند تا خطای OOM رد نشود
maxmemory-policy volatile-lru

# ذخیره‌سازی داده‌های پایدار (AOF / RDB)
save 900 1
save 300 10
save 60 10000

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
