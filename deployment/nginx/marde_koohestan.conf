# ==============================================================================
# پیکربندی Nginx برای پلتفرم مرد کوهستان (سطح Senior Enterprise)
# اهداف: مقاومت در برابر DDoS، هندل ترافیک سنگین، صفر کردن خطای 502 و حذف فشار رم
# ==============================================================================

# ۱. تعریف لایه‌های محدودکننده Rate Limit و Connection در لایه اول وب‌سرور
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_sensitive:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

# ۲. تعریف Upstream به همراه Keepalive Connection برای به حداقل رساندن Overhead
upstream django_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    # در کلاسترهای بزرگ، سرورهای پشتیبان اضافه می‌شوند:
    # server 127.0.0.1:8001 backup;
    keepalive 64;
}

upstream nextjs_frontend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name mardekoohestan.ir www.mardekoohestan.ir;

    # تغییر مسیر خودکار به HTTPS در محیط پروداکشن
    # return 301 https://$host$request_uri;

    # سقف حجم مجاز برای آپلود و بدنه درخواست (جلوگیری از حملات اشغال رم OOM)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # تایم‌اوت‌های جلوگیری از حملات Slowloris
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 15s;
    keepalive_timeout 65s;

    # فشرده‌سازی Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # محدود کردن تعداد کانکشن‌های همزمان از یک IP
    limit_conn addr_conn 50;

    # =========================================================================
    # فایل‌های استاتیک و رسانه‌ها (سرو مستقیم با کش بلندمدت بدون درگیر کردن پایتون)
    # =========================================================================
    location /static/ {
        alias /var/www/mardekoohestan/backend/django/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
    }

    location /media/ {
        alias /var/www/mardekoohestan/backend/django/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # =========================================================================
    # مسیرهای API بک‌اند و پنل‌های ادمین
    # =========================================================================
    location ~ ^/(api|admin|studio|ckeditor5)/ {
        # اعمال Rate Limit عمومی در لایه Nginx قبل از ورود به دجانگو
        limit_req zone=api_general burst=40 nodelay;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # تنظیمات حیاتی ضد ۵۰۲ (بافر و بازتلاش هوشمند در صورت ریستارت ورکر)
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        # در صورت مواجهه با خطای 502/503/timeout از سمت ورکر در حال ریستارت، فوراً به گره بعدی بفرست
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # مسیرهای حساس احراز هویت با Rate Limit سفت‌تر
    location ~ ^/api/auth/(login|register|password)/ {
        limit_req zone=auth_sensitive burst=10 nodelay;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # =========================================================================
    # فرانت‌اند Next.js (SSR / Static Pages)
    # =========================================================================
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
